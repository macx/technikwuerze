label: Show details
icon: star
columns:
    - width: 1/1
      sections:
          spacer:
              type: fields
              fields:
                  headlineInfos:
                      type: headline
                      label: Podcast details
    - width: 1/4
      sections:
          graphics:
              type: fields
              fields:
                  podcasterCover:
                      type: files
                      label: Cover Image
                      layout: cards
                      multiple: false
                      required: true
                      template: podcaster-cover
                      query: page.images
                      image:
                          cover: true
                          ratio: 1/1
    - width: 2/4
      sections:
          infos:
              type: fields
              fields:
                  podcasterTitle:
                      label: Podcast Title
                      type: text
                      required: true
                  podcasterSubtitle:
                      label: Podcast Subtitle
                      type: text
                  podcasterDescription:
                      label: Description
                      type: textarea
                      size: medium
                  podcasterCopyright:
                      label: Copyright
                      type: text
                      required: true

    - width: 1/4
      sections:
          taxonomy:
              type: fields
              fields:
                  podcasterKeywords:
                      label: Apple Keywords
                      type: tags
                  podcasterCategories:
                      label: Apple Categories
                      type: structure
                      required: true
                      fields:
                          podcasterMainCategory:
                              label: Main
                              type: select
                              options:
                                  type: query
                                  query: site.getAppleMetadata('categories')
                                  value: '{{ item.value }}'
                                  text: '{{ item.text }}'
                  podcasterType:
                      label: Podcast type
                      type: radio
                      default: episodic
                      options:
                          episodic: Episodic
                          serial: Serial
                  podcasterLanguage:
                      label: Language
                      type: select
                      options:
                          type: query
                          query: site.getAppleMetadata('languages')
                          value: '{{ item.value }}'
                          text: '{{ item.text }}'
                      required: true
                  podcasterAuthorNames:
                      label:
                          de: Autor:innen (Anzeige)
                          en: Author display name
                      type: text
                      required: true
                      help:
                          de: Erscheint 1:1 in itunes:author und googleplay:author. Mehrere Namen kommagetrennt eintragen.
                          en: Appears verbatim in itunes:author and googleplay:author. Enter multiple names comma-separated.
                  podcasterAuthorEmail:
                      label:
                          de: Autor:innen-E-Mail
                          en: Author email
                      type: email
                      help:
                          de: Wird für googleplay:email verwendet. Öffentlich sichtbar — keine private Adresse eintragen.
                          en: Used for googleplay:email. Publicly visible — do not enter a private address.
                  podcasterOwnerName:
                      label:
                          de: Feed-Inhaber (nicht öffentlich)
                          en: Feed owner (not public)
                      type: text
                      required: true
                  podcasterOwnerEmail:
                      label:
                          de: Feed-Inhaber-E-Mail (nicht öffentlich)
                          en: Feed owner email (not public)
                      type: email
                      required: true
                      help:
                          de: Dient nur der Konto-Verifizierung bei Apple/Google, nicht öffentlich sichtbar.
                          en: Used only for account verification with Apple/Google, not publicly displayed.
